<script>
document.addEventListener('DOMContentLoaded', () => {
    const triggers = document.querySelectorAll('.master-plan-trigger');
    const modal = document.getElementById('master-plan-modal');
    const closeBtn = modal?.querySelector('.modal-close');

    if (modal && triggers.length > 0) {
        triggers.forEach(trigger => {
            trigger.onclick = (e) => {
                e.preventDefault();
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.style.opacity = '1';
                    modal.querySelector('.modal-content').style.transform = 'scale(1) translateY(0)';
                }, 10);
                document.body.style.overflow = 'hidden';
            };
        });

        const closeModal = () => {
            modal.style.opacity = '0';
            modal.querySelector('.modal-content').style.transform = 'scale(0.9) translateY(20px)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 500);
            document.body.style.overflow = '';
        };

        closeBtn.onclick = closeModal;
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    }
});
</script>
