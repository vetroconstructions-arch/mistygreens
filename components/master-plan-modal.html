<div id="master-plan-modal" class="modal-system" style="display: none; position: fixed; inset: 0; background: rgba(10, 5, 5, 0.98); z-index: 20000; backdrop-filter: blur(20px); align-items: center; justify-content: center; opacity: 0; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);">
    <div aria-label="Close Modal" role="button" class="modal-close" style="position: absolute; top: 2rem; right: 2rem; color: #fff; font-size: 2rem; cursor: pointer; z-index: 20001; transition: transform 0.4s;">&times;</div>
    <div class="modal-content" style="width: 90%; max-width: 1400px; max-height: 85vh; position: relative; transform: scale(0.9) translateY(20px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
        <div class="modal-header" style="margin-bottom: 2rem; text-align: center;">
            <span style="color: var(--pscl-gold); text-transform: uppercase; letter-spacing: 0.3em; font-size: 0.75rem; font-weight: 700;">Township Sovereignty</span>
            <h3 style="color: #fff; font-family: var(--font-heading); font-size: 2.5rem; margin-top: 0.5rem;">Sovereign Master Plan — 190 Acres</h3>
        </div>
        <div class="modal-body" style="position: relative; overflow: auto; border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; background: #000; box-shadow: 0 30px 100px rgba(0,0,0,0.8);">
            <img width="1400" height="1000" src="/images/master-plan.webp" alt="190-Acre Master Plan of Paranjape Forest Trails Township Bhugaon" style="width: 100%; height: auto; display: block; filter: contrast(1.1) brightness(1.05);" loading="lazy" decoding="async">
        </div>
        <div class="modal-footer" style="margin-top: 2rem; text-align: center;">
            <button class="open-enquiry-modal" id="cta-components-master-plan-modal-enquire" data-project="Master Plan Inquiry" style="background: var(--pscl-gold); color: #000; padding: 1rem 2.5rem; border: none; border-radius: 50px; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;">DOWNLOAD PDF BROCHURE</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const triggers = document.querySelectorAll('.master-plan-trigger');
    const modal = document.getElementById('master-plan-modal');
    const closeBtn = modal?.querySelector('.modal-close');

    if (modal && triggers.length > 0) {
        triggers.forEach(trigger => {
            trigger.onclick = (e) => {
                e.preventDefault();
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.style.opacity = '1';
                    modal.querySelector('.modal-content').style.transform = 'scale(1) translateY(0)';
                }, 10);
                document.body.style.overflow = 'hidden';
            };
        });

        const closeModal = () => {
            modal.style.opacity = '0';
            modal.querySelector('.modal-content').style.transform = 'scale(0.9) translateY(20px)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 500);
            document.body.style.overflow = '';
        };

        closeBtn.onclick = closeModal;
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    }
});
</script>
