<!-- Ultra-Luxurious Sovereign Enquiry & Callback Modal (v2026) -->
<div class="concierge-modal" id="heritage-concierge" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="enquiry-modal-title" style="position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; padding: 1.25rem;">
  <div class="concierge-overlay" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);"></div>
  
  <div class="concierge-panel" style="position: relative; background: linear-gradient(160deg, #151515 0%, #0a0a0a 100%); width: 100%; max-width: 500px; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(212, 175, 55, 0.15); border: 1.5px solid rgba(212, 175, 55, 0.4); padding: 0; animation: sovereignModalEntry 0.35s cubic-bezier(0.16, 1, 0.3, 1);">
    
    <!-- Top Gold Gradient Accent Line -->
    <div style="height: 4px; background: linear-gradient(90deg, #6B0D0D, #D4AF37, #6B0D0D);"></div>
    
    <!-- Close Button -->
    <button aria-label="Close Modal" id="concierge-close" type="button" style="position: absolute; top: 1.1rem; right: 1.2rem; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;">✕</button>

    <div style="padding: 2.2rem 2rem 2rem; max-height: 90vh; overflow-y: auto;">
      
      <!-- Header -->
      <div class="form-header" style="text-align: center; margin-bottom: 1.5rem;">
        <span style="display: inline-block; background: rgba(212, 175, 55, 0.12); border: 1px solid rgba(212, 175, 55, 0.35); color: #D4AF37; font-weight: 800; font-size: 0.68rem; letter-spacing: 0.15rem; text-transform: uppercase; padding: 0.3rem 0.9rem; border-radius: 50px; margin-bottom: 0.8rem;">✦ OFFICIAL TOWNSHIP SALES DESK</span>
        <h3 id="enquiry-modal-title" style="font-family: 'Playfair Display', serif; font-size: 1.75rem; color: #ffffff; margin: 0 0 0.4rem; line-height: 1.25; font-weight: 700;">Get Instant <i style="color: #D4AF37;">Price & Brochure</i></h3>
        <p id="enquiry-modal-desc" style="color: rgba(255, 255, 255, 0.75); font-size: 0.85rem; line-height: 1.45; margin: 0;">Direct developer pricing, layout blueprints & VIP site-visit guidance.</p>
      </div>

      <!-- Lead Capture Form (Frictionless 1-Screen Flow) -->
      <form id="enquiry-form-modal" method="POST" action="https://formsubmit.co/propsmartrealty@gmail.com" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="hidden" name="_next" value="https://www.paranjapetownship.com/thank-you.html">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="New Website Enquiry - Paranjape Forest Trails">
        <input type="hidden" name="project_context" id="modal-project-context" value="Forest Trails Township">

        <!-- Project Interest Dropdown / Selector -->
        <div>
          <label style="display: block; color: rgba(255,255,255,0.85); font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem;">Select Project Interest</label>
          <div style="position: relative;">
            <select name="interest" id="modal-interest-select" required style="width: 100%; background: #1a1a1a; color: #ffffff; border: 1.5px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.88rem; outline: none; appearance: none; -webkit-appearance: none; cursor: pointer;">
              <option value="all">🌟 All Paranjape Forest Trails Projects</option>
              <option value="misty-greens">🌳 Misty Greens (NA Bungalow Plots from ₹1.23 Cr*)</option>
              <option value="the-rivolo">🏡 The Rivolo (4 & 5 BHK Luxury Forest Villas from ₹3.89 Cr*)</option>
              <option value="the-cove">🏰 The Cove (4 BHK Duet Villas from ₹2.85 Cr*)</option>
              <option value="athashri-senior-living">👴 Athashri (2 BHK Senior Living from ₹83 Lakhs*)</option>
              <option value="everglades">🏢 Everglades (1 & 2 BHK PRO Homes from ₹48.50 Lakhs*)</option>
              <option value="the-canopy">🌅 The Canopy (2 & 3 BHK Nature Flats from ₹89 Lakhs*)</option>
              <option value="the-highgardens">🌿 The Highgardens (Terrace Homes from ₹89 Lakhs*)</option>
              <option value="verandah">🏡 Verandah (Duplex Homes from ₹93 Lakhs*)</option>
              <option value="orchard-residences">🍃 Orchard Residences (Hillside Homes from ₹83 Lakhs*)</option>
              <option value="swaniketan">🤝 Swaniketan (Assisted Living from ₹79 Lakhs*)</option>
            </select>
            <div style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #D4AF37; font-size: 0.75rem;">▼</div>
          </div>
        </div>

        <!-- Full Name -->
        <div>
          <label style="display: block; color: rgba(255,255,255,0.85); font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem;">Your Full Name *</label>
          <input type="text" name="name" placeholder="e.g. Rahul Sharma" required style="width: 100%; background: #1a1a1a; color: #ffffff; border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.88rem; outline: none; box-sizing: border-box; transition: border-color 0.2s;" onfocus="this.style.borderColor='#D4AF37';" onblur="this.style.borderColor='rgba(255,255,255,0.15)';">
        </div>

        <!-- Mobile Phone with Country Code -->
        <div>
          <label style="display: block; color: rgba(255,255,255,0.85); font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem;">Mobile Phone Number *</label>
          <div style="display: flex; gap: 8px;">
            <div style="padding: 0.8rem 0.9rem; background: #1a1a1a; border: 1.5px solid rgba(212, 175, 55, 0.35); border-radius: 12px; color: #D4AF37; font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; white-space: nowrap;">
              <span>🇮🇳</span> +91
            </div>
            <input type="tel" name="phone" id="concierge-phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required style="flex: 1; width: 100%; background: #1a1a1a; color: #ffffff; border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.88rem; outline: none; box-sizing: border-box; transition: border-color 0.2s;" onfocus="this.style.borderColor='#D4AF37';" onblur="this.style.borderColor='rgba(255,255,255,0.15)';">
          </div>
        </div>

        <!-- Email Address -->
        <div>
          <label style="display: block; color: rgba(255,255,255,0.85); font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem;">Email Address (For Instant PDF Brochure)</label>
          <input type="email" name="email" placeholder="e.g. rahul@gmail.com" style="width: 100%; background: #1a1a1a; color: #ffffff; border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.88rem; outline: none; box-sizing: border-box; transition: border-color 0.2s;" onfocus="this.style.borderColor='#D4AF37';" onblur="this.style.borderColor='rgba(255,255,255,0.15)';">
        </div>

        <!-- WhatsApp Opt-in Checkbox -->
        <div style="display: flex; align-items: center; gap: 10px; background: rgba(37, 211, 102, 0.08); padding: 0.65rem 0.9rem; border-radius: 10px; border: 1px solid rgba(37, 211, 102, 0.25);">
          <input type="checkbox" name="whatsapp_optin" id="wa-optin" checked style="width: 17px; height: 17px; accent-color: #25D366; cursor: pointer;">
          <label for="wa-optin" style="color: rgba(255,255,255,0.9); font-size: 0.76rem; cursor: pointer; line-height: 1.35;">Send brochure, pricing sheet & floor plans on WhatsApp</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" style="width: 100%; background: linear-gradient(135deg, #6B0D0D 0%, #8B1A1A 50%, #D4AF37 100%); color: #ffffff; border: 1px solid #D4AF37; padding: 0.95rem 1.5rem; border-radius: 12px; font-weight: 800; font-size: 0.88rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 25px rgba(107, 13, 13, 0.5); transition: transform 0.2s, box-shadow 0.2s; margin-top: 0.3rem;">
          GET INSTANT BROCHURE & PRICING &rarr;
        </button>

        <!-- Trust Badges -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 0.3rem; color: rgba(255,255,255,0.5); font-size: 0.7rem;">
          <span>🔒 100% Privacy</span>
          <span>•</span>
          <span>🏛️ Direct PSCL Advisory</span>
          <span>•</span>
          <span>📜 Zero Spam</span>
        </div>

      </form>
    </div>
  </div>
</div>
