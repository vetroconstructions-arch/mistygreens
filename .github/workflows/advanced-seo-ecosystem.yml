name: Advanced SEO Ecosystem CI/CD

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours for freshness signals
  workflow_dispatch:

jobs:
  seo-ecosystem-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm install

      - name: Generate Canonical Matrix & Sitemap
        run: |
          echo "🗺️ Rebuilding Canonical Logic, Feeds, and Prioritized Sitemaps..."
          python3 scripts/enterprise_google_seo_hardening.py
          python3 scripts/generate_seo_matrix.py
          python3 scripts/generate_google_merchant_feed.py
          python3 scripts/generate_image_sitemap.py
          python3 scripts/dispatch_indexnow.py
          node scripts/generate-sitemap.js || echo "Node sitemap generation skipped"

      - name: Auto-Commit SEO Infrastructure
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap*.xml google-merchant-feed.xml google-products.xml rss.xml indexnow_payload.json robots.txt
          git commit -m "🤖 Auto-sync: Regenerated SEO Sitemap and Canonical Matrix [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or failed"

      - name: Authenticate Google API
        run: |
          echo "Setting up Google Service Account..."
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Sovereign Enterprise Google & Multi-Engine Indexing Suite
        run: |
          echo "🚀 Executing Sovereign Enterprise Google Indexing Suite v3.0..."
          node scripts/enterprise_google_indexing.js || echo "⚠️ Enterprise Indexing Suite execution notice"
          echo "✅ Enterprise indexing pass completed."
