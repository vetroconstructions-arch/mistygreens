# .github/workflows/google-indexing.yml
name: Daily Google Indexing Force-Ping
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  google-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service-account.json
      - run: node scripts/google-indexing-worker.js
