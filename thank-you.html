<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Paranjape Forest Trails</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--pscl-dark);
            color: var(--pscl-light);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }
        .thank-you-container {
            max-width: 600px;
            padding: 4rem 2rem;
            background: rgba(13, 20, 16, 0.4);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: var(--pscl-gold);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #a0aab2;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .home-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--pscl-gold), #e8c678);
            color: #0d1410;
            padding: 1rem 2.5rem;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.1em;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <h1>Enquiry Received</h1>
        <p>Thank you for your interest in Paranjape Forest Trails, Bhugaon. Our luxury real estate concierge has received your details and will contact you shortly to arrange your exclusive preview.</p>
        <a href="/" class="home-btn">RETURN TO HOME</a>
    </div>
</body>
</html>
